services:
  bookshelf-screensaver:
    build: .
    container_name: bookshelf-screensaver
    env_file:
      - .env
    environment:
      ABS_URL: http://audiobookshelf:80
      BOOKSHELF_DATA_DIR: /app/data
      BOOKSHELF_OUTPUT_DIR: /app/output
      BOOKSHELF_WORK_DIR: /app/work
      PORT: "8787"
      POLL_SECONDS: "${POLL_SECONDS:-43200}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  web:
    external: true
